# LOCAL ONLY stand-in for the SQS queues defined in infra/modules/aws-core.
include classpath("application.conf")

node-address {
  protocol = http
  host = "127.0.0.1"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  vaultops-local-webhook-events-dlq {}
  vaultops-local-webhook-events {
    # 2 s instead of 180 s so retry/DLQ behaviour is observable in tests
    defaultVisibilityTimeout = 2 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "vaultops-local-webhook-events-dlq"
      maxReceiveCount = 5
    }
  }
}
