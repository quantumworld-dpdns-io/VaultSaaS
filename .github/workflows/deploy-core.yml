name: deploy-core

on:
  push:
    branches: [main]
    paths: ["services/core/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      max-parallel: 1
      matrix:
        env: [dev, prod]
    environment: ${{ matrix.env }}
    concurrency: core-${{ matrix.env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/core/go.mod
          cache-dependency-path: services/core/go.sum
      - run: make test-core
      - run: make build-core
      - name: database migrations (Supabase, owner role)
        working-directory: services/core
        env:
          DATABASE_OWNER_URL: ${{ secrets.DATABASE_OWNER_URL }}
          VAULTOPS_APP_DB_PASSWORD: ${{ secrets.VAULTOPS_APP_DB_PASSWORD }}
        run: go run ./cmd/vaultctl migrate --dir ../../db/migrations --set-app-password
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/vaultops-deploy
          aws-region: ap-northeast-1
      - name: update function code
        run: |
          for fn in api worker recon; do
            [ -f "services/core/bin/$fn.zip" ] || continue
            aws lambda update-function-code \
              --function-name "vaultops-${{ matrix.env }}-$fn" \
              --zip-file "fileb://services/core/bin/$fn.zip" \
              --architectures arm64 --publish --output text --query 'Version'
          done
