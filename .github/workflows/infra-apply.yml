name: infra-apply

on:
  push:
    branches: [main]
    paths: ["infra/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      max-parallel: 1
      matrix:
        env: [dev, prod]
    concurrency: tf-${{ matrix.env }}
    env:
      TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_domain: ${{ vars.DOMAIN }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_READ }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/vaultops-tf-plan
          aws-region: ap-northeast-1
      - uses: ./.github/actions/tf-setup
        with:
          env: ${{ matrix.env }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - run: |
          terraform -chdir=infra/envs/${{ matrix.env }} plan -input=false -no-color -out=tfplan
          terraform -chdir=infra/envs/${{ matrix.env }} show -json tfplan > tfplan.json
      - run: infra/scripts/policy-check.sh tfplan.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-${{ matrix.env }}
          path: infra/envs/${{ matrix.env }}/tfplan
          retention-days: 3

  apply:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      max-parallel: 1
      matrix:
        env: [dev, prod]
    # The GitHub environment carries the approval gate (required reviewers on prod)
    # and is the only OIDC subject the tf-apply role trusts.
    environment: ${{ matrix.env }}
    concurrency: tf-${{ matrix.env }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/vaultops-tf-apply
          aws-region: ap-northeast-1
      - uses: ./.github/actions/tf-setup
        with:
          env: ${{ matrix.env }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-${{ matrix.env }}
          path: infra/envs/${{ matrix.env }}
      - name: apply the reviewed plan
        run: terraform -chdir=infra/envs/${{ matrix.env }} apply -input=false -no-color tfplan
