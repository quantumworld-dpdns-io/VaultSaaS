name: infra-plan

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra-*.yml", ".github/actions/tf-setup/**"]

permissions:
  contents: read

jobs:
  offline-policy:
    # Runs without any cloud credentials (also on forks): fmt, validate and the
    # principle-0 policy against offline plans.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - run: GOBIN="$RUNNER_TEMP/bin" go install github.com/open-policy-agent/conftest@v0.71.1 && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: infra/scripts/validate.sh
      - run: infra/scripts/policy-check.sh

  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: offline-policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      matrix:
        env: [dev, prod]
    concurrency: tf-${{ matrix.env }}
    env:
      TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_domain: ${{ vars.DOMAIN }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_READ }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/vaultops-tf-plan
          aws-region: ap-northeast-1
      - uses: ./.github/actions/tf-setup
        with:
          env: ${{ matrix.env }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: plan
        run: |
          terraform -chdir=infra/envs/${{ matrix.env }} plan -input=false -lock=false -no-color -out=tfplan
          terraform -chdir=infra/envs/${{ matrix.env }} show -json tfplan > tfplan.json
          terraform -chdir=infra/envs/${{ matrix.env }} show -no-color tfplan > plan.txt
      - name: principle-0 policy (real plan)
        run: infra/scripts/policy-check.sh tfplan.json
      - name: comment plan summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### terraform plan — \`${{ matrix.env }}\`"
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo '```'
            echo "<details><summary>full plan</summary>"
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
            echo "</details>"
          } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
