name: terraform setup
description: Install Terraform + conftest and initialise an environment against the R2 state backend.
inputs:
  env:
    description: dev | prod
    required: true
  r2-access-key-id:
    required: true
  r2-secret-access-key:
    required: true
  cloudflare-account-id:
    required: true
runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: 1.16.0
        terraform_wrapper: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.27"
        cache: false
    - name: Install conftest
      shell: bash
      run: |
        GOBIN="$RUNNER_TEMP/bin" go install github.com/open-policy-agent/conftest@v0.71.1
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
    - name: R2 backend credentials (named profile, never the AWS provider's)
      shell: bash
      env:
        R2_KEY: ${{ inputs.r2-access-key-id }}
        R2_SECRET: ${{ inputs.r2-secret-access-key }}
        CF_ACCOUNT: ${{ inputs.cloudflare-account-id }}
      run: |
        mkdir -p ~/.aws
        printf '[vaultops-r2]\naws_access_key_id = %s\naws_secret_access_key = %s\n' "$R2_KEY" "$R2_SECRET" >> ~/.aws/credentials
        chmod 600 ~/.aws/credentials
        cat > infra/backend.r2.hcl.local <<EOF
        bucket    = "vaultops-tfstate"
        profile   = "vaultops-r2"
        endpoints = { s3 = "https://${CF_ACCOUNT}.r2.cloudflarestorage.com" }
        EOF
    - name: terraform init
      shell: bash
      run: terraform -chdir=infra/envs/${{ inputs.env }} init -input=false -backend-config=../../backend.r2.hcl.local
